[project]
name = "poe2-mcp"
version = "0.1.0"
description = "Path of Exile 2 MCP server for build analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
poe2-mcp = "poe2_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poe2_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
