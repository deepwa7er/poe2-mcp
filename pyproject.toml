[project]
name = "poe2-mcp"
version = "0.1.0"
description = "Path of Exile 2 MCP server for build analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
poe2-mcp = "poe2_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poe2_mcp"]

# Ship the vendored data exports and the Lua driver inside the wheel so the
# installed console script works outside a repo checkout (resolved via
# poe2_mcp/_resources.py, which prefers these over the repo-layout paths).
[tool.hatch.build.targets.wheel.force-include]
"data" = "poe2_mcp/_bundled/data"
"lua" = "poe2_mcp/_bundled/lua"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
